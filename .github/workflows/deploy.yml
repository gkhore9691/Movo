name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVER_HOST: 3.110.122.148
  SERVER_USER: ubuntu
  DEPLOY_PATH: /home/ubuntu/movo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Build backend
        working-directory: ./server
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Backup server .env files
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            # Backup .env files before deployment
            cp /home/ubuntu/movo/server/.env /tmp/movo-server-env.bak 2>/dev/null || true
            cp /home/ubuntu/movo/scripts/.env /tmp/movo-scripts-env.bak 2>/dev/null || true
          EOF

      - name: Deploy to server
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude 'server/node_modules' \
            --exclude '.git' \
            --exclude '*.pem' \
            --exclude 'scripts/downloads' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Restore .env files and restart
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            cd /home/ubuntu/movo

            # Restore .env files
            cp /tmp/movo-server-env.bak /home/ubuntu/movo/server/.env 2>/dev/null || true
            cp /tmp/movo-scripts-env.bak /home/ubuntu/movo/scripts/.env 2>/dev/null || true

            # Install frontend dependencies
            npm ci --production=false

            # Install backend dependencies
            cd server
            npm ci --production=false

            # Restart the API
            pm2 restart movo-api

            echo "Deployment complete!"
          EOF

      - name: Health check
        run: |
          sleep 8
          # Check if API is responding (401 is OK - means API is running but needs auth)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://movo.suprminds.in/api/auth/me)
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "Health check passed! API returned $HTTP_CODE"
          else
            echo "Health check failed! API returned $HTTP_CODE"
            exit 1
          fi
